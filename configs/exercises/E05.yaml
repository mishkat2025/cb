# E05 Circumduction (full scope, D0; user answer 1). EAAQ: pending.
code: E05
name: circumduction
body_region: shoulder
status: in_scope_full
references:
  primary: "Circumduction.mp4"   # side view, right arm
  backup: []
primary_angle:                   # P6 / M16: segmentation only
  name: wrist_height_2d          # wrist height above mid-shoulder (2D); cross-view agreement 82% (Step 0)
  source: image
  side: auto
reps:                            # P6c: per-video adaptive thresholds, the Step 0 method (PROGRESS §3.7.5)
  adaptive: true
  prominence_frac: 0.4           # x the video's p5-p95 signal range
  min_amplitude_frac: 0.3
  polarity: peak                 # P6c: rep = the wrist rising (arm down = rest)
  max_rep_s: 20.0
pairs:                           # C1(c), A5: DTW angles for rep-matched pairs (user, 2026-10-20: per exercise)
  dtw_angles: [shoulder_elevation_left, shoulder_elevation_right, elbow_left, elbow_right]
eaaq:
  expected_reps: 10              # TODO: verify when the EAAQ appendix is available
assess:                          # Module III (M16 starting definitions, implemented 2026-10-20, M17); rules: TODO verify
                                 # against this exercise's EAAQ when the appendix is available (M5)
  angle: shoulder_elevation      # elevation over the circle (ROM) ...
  path_measures: [wrist_path]    # ... + the wrist path's amplitude and circularity (reported, not scored; M17)
  rom_direction: max
  align: arm                     # the upper-arm direction traces the circle
  mirror_left_arm: true
  speed: {source: expert_data, expert_min_score: 95, eaaq_phase_s: null}
  channels: [shoulder_elevation, elbow_extension, trunk_lateral_lean, shoulder_asymmetry]
  posture_channels: [elbow_extension, trunk_lateral_lean, shoulder_asymmetry]   # M14
  score:
    angle_channels: [shoulder_elevation, elbow_extension, trunk_lateral_lean]
    symmetry_channel: shoulder_asymmetry
  rules:
    - {type: circumduction_range_insufficient, measure: rom_shortfall, joint: moving_shoulder}
    - {type: elbow_bent, channel: elbow_extension, direction: below, joint: moving_elbow}
    - {type: trunk_lean, channel: trunk_lateral_lean, direction: both, joint: trunk}
    - {type: shoulder_hitch, channel: shoulder_asymmetry, direction: above, joint: moving_shoulder}
    - {type: too_fast, measure: speed, direction: fast}
    - {type: too_slow, measure: speed, direction: slow}
