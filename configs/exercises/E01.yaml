# E01 Abduction (in scope, D0). EAAQ: dataset paper Fig. 4.
code: E01
name: abduction
body_region: shoulder
status: in_scope
references:                      # M4: PT demos in data.reference_dir
  primary: "Abduction .mp4"
  backup: ["Abduction Adduction.mp4"]
primary_angle:                   # drives rep segmentation (P6)
  name: shoulder_elevation       # angle between upper arm and trunk line (0 = arm at side, 180 = overhead)
  source: world                  # world (3D MediaPipe world landmarks) | image (2D)
  side: auto                     # auto = the arm with the larger range in the video
reps:                            # P6: chosen by cross-view rep-count agreement (scripts/phase1/rep_signal_check.py)
  polarity: peak                 # rep = rest -> peak elevation -> rest
  prominence: 30                 # deg
  min_amplitude: 30              # deg
eaaq:                            # M5, from the E01 questionnaire
  expected_reps: 10              # PF4 "Repetition: minimum 10 times"
  phase_s: [1.5, 2.5]            # PF2: 1.5-2.5 s to raise or to lower the arm
  target_rom_deg: [170, 180]     # CF2: right arm 0 -> 170/180 deg, palms forward
  moving_arm: right              # CF2: left arm stays at the side
assess:                          # Module III (Phase 4); supervisor answers 1, 2, 4 (2026-10-17)
  angle: shoulder_elevation      # joint angle assessed (3D, world landmarks)
  mirror_left_arm: true          # left-arm performances are mirrored and assessed normally
  flag_arm_side: false           # left-arm scores not significantly lower (scripts/phase1/left_arm_scores.py)
  speed:
    source: expert_data          # expert_data | eaaq
    expert_min_score: 95         # tolerances from reps of expert videos scoring >= this
    eaaq_phase_s: [1.5, 2.5]     # documented alternative (PF2 text), used when source: eaaq
  # Phase 4 (M7): channels compared with the PT template (3D, moving arm = side; left arms mirrored)
  channels: [shoulder_elevation, elbow_extension, contralateral_elevation, trunk_lateral_lean, shoulder_asymmetry]
  score:
    angle_channels: [shoulder_elevation, elbow_extension, contralateral_elevation, trunk_lateral_lean]
    symmetry_channel: shoulder_asymmetry
  rules:                         # M12: EAAQ (M5): arm 0 -> 170-180 deg, other arm at the side, elbows straight,
    - {type: abduction_range_insufficient, measure: rom_shortfall, joint: moving_shoulder}   # neutral trunk
    - {type: elbow_bent, channel: elbow_extension, direction: below, joint: moving_elbow}
    - {type: other_arm_raised, channel: contralateral_elevation, direction: above, joint: other_shoulder}
    - {type: trunk_lean, channel: trunk_lateral_lean, direction: both, joint: trunk}
    - {type: shoulder_asymmetry, channel: shoulder_asymmetry, direction: above, joint: moving_shoulder}
    - {type: too_fast, measure: speed, direction: fast}
    - {type: too_slow, measure: speed, direction: slow}
