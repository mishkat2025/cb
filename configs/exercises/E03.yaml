# E03 Lateral rotation (full scope, D0; user answer 1, 2026-10-20). EAAQ: pending (appendix, PROGRESS §3.7.8).
# The dataset executes right-arm external rotation in the 90/90 position (shoulder abduction ~89 deg, elbow ~90 deg).
code: E03
name: lateral_rotation
body_region: shoulder
status: in_scope_full            # configs/data_full.yaml; the pilot config (data.yaml) includes E01/E02 only
references:                      # M3: V3 (90/90) is the closest demo (Chamfer 13.5 deg vs 19.1 v1, 55.3 V2)
  primary: "Later Rotation V3.mp4"
  primary_view: front             # apparent camera view of the demo (PROGRESS §3.6, §3.7.7; demo X6)
  backup: ["Lateral Rotation.mp4"]
  notes: both arms (left mirrored), working phase only (shoulder abduction >= 70 deg)   # M3, applied in Phase 4
primary_angle:                   # P6 / M16 / P6d: rep signal = the Module III main angle
  name: forearm_elevation        # forearm vs the trunk's up axis (3D); chosen by cross-view rep agreement (P6d): 57.0% of
  source: world                  # 114 synced groups within +-1 vs 55.3% for the earlier wrist-path PC1
  side: auto                     # the arm whose signal has the larger p5-p95 range
  orient_by: {name: forearm_elevation, source: world, sign: -1}   # P6c: the signal rises as the forearm goes up
reps:                            # P6c: per-video adaptive thresholds, the Step 0 method (PROGRESS §3.7.5)
  adaptive: true
  prominence_frac: 0.4           # x the video's p5-p95 signal range
  min_amplitude_frac: 0.3
  polarity: peak                 # P6c: rep = the forearm rising (signal oriented by orient_by)
  max_rep_s: 20.0
pairs:                           # C1(c), A5: DTW angles for rep-matched pairs (user, 2026-10-20: per exercise)
  dtw_angles: [forearm_elevation_left, forearm_elevation_right, shoulder_elevation_left, shoulder_elevation_right]
eaaq:
  expected_reps: 10              # TODO: verify when the EAAQ appendix is available
assess:                          # Module III (M16 starting definitions, implemented 2026-10-20, M17); rules: TODO verify
                                 # against this exercise's EAAQ when the appendix is available (M5)
  angle: forearm_elevation       # forearm vs the trunk's up axis (3D): ~130 (forward-down) -> ~27 deg (up)
  rom_direction: min             # M17: the end range is the minimum (forearm up)
  rom_centre: experts            # M18 (post-hoc, user 2026-10-20): the range target = the >= 95 experts' mean end range
                                 # per view (training subjects); the V3 demo (19 deg) is beyond most experts (~27 deg)
  align: forearm                 # M17: DTW on the forearm direction in the trunk frame (the upper arm stays at 90/90)
  mirror_left_arm: true
  template_both_sides: true      # M3: V3 shows both arms; the left one is mirrored and averaged in
  template_working_phase: {channel: shoulder_elevation, min_deg: 70}   # M3: only the 90/90 working phase of the demo
  speed: {source: expert_data, expert_min_score: 95, eaaq_phase_s: null}
  channels: [forearm_elevation, shoulder_elevation, elbow_extension, trunk_lateral_lean, shoulder_asymmetry]
  posture_channels: [shoulder_elevation, elbow_extension, trunk_lateral_lean, shoulder_asymmetry]   # M14
  score:
    angle_channels: [forearm_elevation, shoulder_elevation, elbow_extension, trunk_lateral_lean]
    symmetry_channel: shoulder_asymmetry
  rules:
    - {type: lateral_rotation_range_insufficient, measure: rom_shortfall, joint: moving_shoulder}
    - {type: shoulder_abduction_deviation, channel: shoulder_elevation, direction: both, joint: moving_shoulder}
    - {type: elbow_angle_deviation, channel: elbow_extension, direction: both, joint: moving_elbow}
    - {type: trunk_lean, channel: trunk_lateral_lean, direction: both, joint: trunk}
    - {type: shoulder_asymmetry, channel: shoulder_asymmetry, direction: above, joint: moving_shoulder}
    - {type: too_fast, measure: speed, direction: fast}
    - {type: too_slow, measure: speed, direction: slow}
