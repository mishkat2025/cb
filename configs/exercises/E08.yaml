# E08 Lumbar flexion = "Both Leg Flexion" (README, demo): supine, both hips and knees flex together (full scope, D0;
# user answer 1). EAAQ: pending. All male.
code: E08
name: lumbar_flexion
body_region: trunk
status: in_scope_full
references:
  primary: "Both Leg Flection.mp4"   # side view, supine
  primary_view: side             # apparent camera view of the demo (PROGRESS §3.6, §3.7.7; demo X6)
  backup: []
primary_angle:                   # P6 / M16: a joint angle (3D)
  name: hip_flexion              # cross-view agreement 92% (Step 0)
  source: world
  side: auto
reps:                            # P6c: per-video adaptive thresholds, the Step 0 method (PROGRESS §3.7.5)
  adaptive: true
  prominence_frac: 0.4           # x the video's p5-p95 signal range
  min_amplitude_frac: 0.3
  polarity: peak                 # P6c: rep = the hips flexing (legs flat = rest)
  max_rep_s: 20.0
  quality_joints: [knee]
pairs:                           # C1(c), A5: DTW angles for rep-matched pairs (user, 2026-10-20: lower-body angles)
  dtw_angles: [hip_flexion_left, hip_flexion_right, knee_flexion_left, knee_flexion_right]
eaaq:
  expected_reps: 10              # TODO: verify when the EAAQ appendix is available
assess:                          # Module III (M16 starting definitions, implemented 2026-10-20, M17); rules: TODO verify
                                 # against this exercise's EAAQ when the appendix is available (M5)
  angle: hip_flexion             # the leg with the larger range (both flex together)
  rom_direction: max
  align: thighs                  # M17: both thighs' directions in the trunk frame
  both_sides: true
  speed: {source: expert_data, expert_min_score: 95, eaaq_phase_s: null}
  channels: [hip_flexion, knee_flexion, hip_flexion_asymmetry, knee_flexion_asymmetry]
  posture_channels: [knee_flexion, hip_flexion_asymmetry, knee_flexion_asymmetry]   # M14
  score:
    angle_channels: [hip_flexion, knee_flexion]
    symmetry_channel: hip_flexion_asymmetry
  rules:
    - {type: hip_flexion_range_insufficient, measure: rom_shortfall, joint: moving_hip}
    - {type: knee_flexion_deviation, channel: knee_flexion, direction: both, joint: moving_knee}
    - {type: hip_asymmetry, channel: hip_flexion_asymmetry, direction: both, joint: moving_hip}
    - {type: knee_asymmetry, channel: knee_flexion_asymmetry, direction: both, joint: moving_knee}
    - {type: too_fast, measure: speed, direction: fast, joint: moving_hip}
    - {type: too_slow, measure: speed, direction: slow, joint: moving_hip}
