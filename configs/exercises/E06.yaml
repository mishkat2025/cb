# E06 Wrist extension (full scope, D0; user answer 1). EAAQ: pending. Experts only.
# MediaPipe Hands is extracted for E06 (user answer 2; P1c): the wrist angle needs the hand landmarks.
code: E06
name: wrist_extension
body_region: wrist
status: in_scope_full
references:
  primary: "Wrist Extension.mp4" # front-oblique, both wrists; holds each extension (~7x slower than the experts)
  backup: []
primary_angle:                   # P6 / M16: segmentation only (Pose); the Hands wrist angle is checked in Phase 1
  name: wrist_height_2d          # wrist height above mid-shoulder (2D); cross-view agreement 75% (Step 0)
  source: image
  side: auto
reps:                            # P6c: per-video adaptive thresholds, the Step 0 method (PROGRESS §3.7.5)
  adaptive: true
  prominence_frac: 0.4           # x the video's p5-p95 signal range
  min_amplitude_frac: 0.3
  polarity: peak                 # P6c: rep = the arm raised to the extension position (arm down = rest)
  max_rep_s: 20.0
pairs:                           # C1(c), A5: DTW angles for rep-matched pairs (user, 2026-10-20: per exercise)
  dtw_angles: [shoulder_elevation_left, shoulder_elevation_right, elbow_left, elbow_right]
eaaq:
  expected_reps: 10              # TODO: verify when the EAAQ appendix is available
assess:
  # starting definitions (user answer 7, 2026-10-20; M16): implemented and checked in Phase 4, not used yet
  angle: wrist_extension         # forearm (Pose elbow -> wrist) vs hand (Hands wrist -> middle MCP)
  angle_source: hands
  # user answer 1 (2026-10-20; P1c): the Hands angle is not view-consistent (PROGRESS §5b.3), so the wrist angle is
  # assessed in the SIDE views only, on the hand that camera sees, as the unsigned angle in the image plane (where the
  # bend is visible); front-view E06 is assessed without the wrist angle, stated as a limitation
  angle_variant: 2d_unsigned
  angle_views: [L, R]
  near_hand: {L: right, R: left} # the L camera faces the subject's right side (P5 visibility), the R camera the left
  posture_channels: [elbow_extension, shoulder_elevation]   # elbow flexion, forearm position
  both_sides: true
