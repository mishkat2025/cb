# E04 Medial rotation (full scope, D0; user answer 1). EAAQ: pending. Experts only (no non-experts recorded).
# The dataset executes internal rotation with the arm abducted ~70 deg (forearm from ~70 deg to ~145 deg).
code: E04
name: medial_rotation
body_region: shoulder
status: in_scope_full
references:
  primary: "Medial Rotation.mp4"   # oblique view, arm lower than the dataset (elevation 40 vs 69 deg): per-view bias (M8)
  primary_view: oblique             # apparent camera view of the demo (PROGRESS §3.6, §3.7.7; demo X6)
  backup: []
primary_angle:                   # P6 / M16: segmentation only
  name: all_joint_pc1            # PC1 of all coco17 joints (2D); cross-view agreement 64% (Step 0; tied with the wrist PC1)
  source: image
  side_from: {name: wrist_path_pc1, source: world}   # the moving arm: larger wrist-path range
  orient_by: {name: forearm_elevation, source: world, sign: 1}   # P6c: PC rises as the forearm goes down
reps:                            # P6c: per-video adaptive thresholds, the Step 0 method (PROGRESS §3.7.5)
  adaptive: true
  prominence_frac: 0.4           # x the video's p5-p95 signal range
  min_amplitude_frac: 0.3
  polarity: peak                 # P6c: rep = the forearm rotating down (signal oriented by orient_by)
  max_rep_s: 20.0
pairs:                           # C1(c), A5: DTW angles for rep-matched pairs (user, 2026-10-20: per exercise)
  dtw_angles: [forearm_elevation_left, forearm_elevation_right, shoulder_elevation_left, shoulder_elevation_right]
eaaq:
  expected_reps: 10              # TODO: verify when the EAAQ appendix is available
assess:                          # Module III (M16 starting definitions, implemented 2026-10-20, M17); rules: TODO verify
                                 # against this exercise's EAAQ when the appendix is available (M5)
  angle: forearm_elevation       # forearm vs the trunk's up axis (3D): ~70 (about horizontal) -> ~145 deg (down)
  rom_direction: max
  align: forearm                 # M17
  mirror_left_arm: true
  speed: {source: expert_data, expert_min_score: 95, eaaq_phase_s: null}
  channels: [forearm_elevation, shoulder_elevation, elbow_extension, trunk_lateral_lean]
  posture_channels: [shoulder_elevation, elbow_extension, trunk_lateral_lean]   # M14
  score:
    angle_channels: [forearm_elevation, shoulder_elevation, elbow_extension, trunk_lateral_lean]
    symmetry_channel: null       # no left/right channel in the M16 list for E04
  rules:
    - {type: medial_rotation_range_insufficient, measure: rom_shortfall, joint: moving_shoulder}
    - {type: shoulder_elevation_deviation, channel: shoulder_elevation, direction: both, joint: moving_shoulder}
    - {type: elbow_angle_deviation, channel: elbow_extension, direction: both, joint: moving_elbow}
    - {type: trunk_lean, channel: trunk_lateral_lean, direction: both, joint: trunk}
    - {type: too_fast, measure: speed, direction: fast}
    - {type: too_slow, measure: speed, direction: slow}
