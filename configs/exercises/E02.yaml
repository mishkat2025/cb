# E02 Adduction (in scope, D0). No EAAQ text yet (appendix pending); rep settings checked on data in Phase 1.
code: E02
name: adduction
body_region: shoulder
status: in_scope
references:
  primary: "Aduction.mp4"
  primary_view: front             # apparent camera view of the demo (PROGRESS §3.6, §3.7.7; demo X6)
  backup: ["Abduction Adduction.mp4"]
primary_angle:                   # P6: rep signal. E02 is cross-body adduction with the arm low (elevation
  name: wrist_path_pc1           # ~10-45 deg); its direction changes with the view, so no single angle segments
  source: world                  # it consistently. PC1 of the wrist path in the trunk frame, oriented toward the
  side: auto                     # midline, gave the best cross-view agreement (scripts/pilot/phase1/rep_*_check.py).
                                 # Not a joint angle: flagged to the supervisor.
reps:
  polarity: peak
  prominence: 0.25               # torso lengths
  min_amplitude: 0.25
eaaq:
  expected_reps: 10              # TODO: verify when the E02 EAAQ appendix is available
assess:                          # Module III (Phase 4); supervisor answers 1, 2, 4 (2026-10-17)
  angle: horizontal_adduction    # 3D: upper arm vs shoulder line in the transverse plane (not the rep signal)
  angle_min_proj: 0.25           # NaN where the upper arm is within ~14.5 deg of vertical (angle unstable)
  mirror_left_arm: true
  flag_arm_side: false           # left-arm scores not significantly lower (scripts/pilot/phase1/left_arm_scores.py)
  speed:
    source: expert_data
    expert_min_score: 95
    eaaq_phase_s: null           # TODO: verify when the E02 EAAQ appendix is available
  # Phase 4 (M7): channels compared with the PT template (3D, moving arm = side; left arms mirrored).
  # shoulder_elevation = the spec's "shoulder abduction angle (trunk line vs upper arm)": the arm stays low in E02.
  channels: [horizontal_adduction, shoulder_elevation, elbow_extension, contralateral_elevation, trunk_lateral_lean,
             shoulder_asymmetry]
  posture_channels: [shoulder_elevation, elbow_extension, contralateral_elevation, trunk_lateral_lean,
                    shoulder_asymmetry]   # M14: centred on the experts
  score:
    angle_channels: [horizontal_adduction, shoulder_elevation, elbow_extension, contralateral_elevation,
                     trunk_lateral_lean]
    symmetry_channel: shoulder_asymmetry
  rules:                         # M12; TODO: verify against the E02 EAAQ when the appendix is available
    - {type: adduction_range_insufficient, measure: rom_shortfall, joint: moving_shoulder}
    - {type: arm_elevation_deviation, channel: shoulder_elevation, direction: both, joint: moving_shoulder}
    - {type: elbow_bent, channel: elbow_extension, direction: below, joint: moving_elbow}
    - {type: other_arm_raised, channel: contralateral_elevation, direction: above, joint: other_shoulder}
    - {type: trunk_lean, channel: trunk_lateral_lean, direction: both, joint: trunk}
    - {type: shoulder_asymmetry, channel: shoulder_asymmetry, direction: above, joint: moving_shoulder}
    - {type: too_fast, measure: speed, direction: fast}
    - {type: too_slow, measure: speed, direction: slow}
