# E09 Back extension (full scope, D0; user answer 1). EAAQ: pending. Prone; all male.
code: E09
name: back_extension
body_region: trunk
status: in_scope_full
references:
  primary: "Back Extension.mp4"  # side view, prone
  backup: []
primary_angle:                   # P6 / M16 / P6d: segmentation only (not a joint angle)
  name: trunk_inclination_2d     # trunk above the image horizontal (2D); chosen by cross-view rep agreement (P6d): 76.9%
  source: image                  # of 78 synced groups within +-1 vs 61.5% for the earlier 3D hip flexion
  side_from: {name: hip_flexion, source: world}   # 'side' names the hip with the larger range (both move)
  orient_by: {name: trunk_thigh_angle, source: world, sign: 1}   # P6c: rises as the trunk is raised
reps:                            # P6c: per-video adaptive thresholds, the Step 0 method (PROGRESS §3.7.5)
  adaptive: true
  prominence_frac: 0.4           # x the video's p5-p95 signal range
  min_amplitude_frac: 0.3
  polarity: peak                 # P6c: rep = the trunk rising (lying flat = rest)
  max_rep_s: 20.0
  quality_joints: [knee]
pairs:                           # C1(c), A5: DTW angles for rep-matched pairs (user, 2026-10-20: trunk / lower-body angles)
  dtw_angles: [trunk_thigh, knee_flexion_left, knee_flexion_right]   # best trunk / lower-body set in the known-warp test:
                                 # 7.4 frames vs 7.8 trunk + hips, 10.8 trunk only (upper-limb angles 4.8; dtw_angle_check)
eaaq:
  expected_reps: 10              # TODO: verify when the EAAQ appendix is available
assess:
  # starting definitions (user answer 7, 2026-10-20; M16): implemented and checked in Phase 4, not used yet
  angle: trunk_thigh_angle     # trunk vs thigh line (0 -> ~45 deg)
  posture_channels: [knee_flexion]   # legs straight on the floor
  symmetry: [hip_flexion]
  both_sides: true
