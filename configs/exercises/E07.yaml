# E07 Hip joint flexion (full scope, D0; user answer 1). EAAQ: pending. 14 experts, all male, no non-experts. Supine.
code: E07
name: hip_joint_flexion
body_region: hip
status: in_scope_full
references:
  primary: "Hip Joint Flection.mp4"   # side view, supine, right leg
  primary_view: side             # apparent camera view of the demo (PROGRESS §3.6, §3.7.7; demo X6)
  backup: []
primary_angle:                   # P6 / M16: segmentation only
  name: all_joint_pc1            # PC1 of all coco17 joints (2D); cross-view agreement 70% (Step 0)
  source: image
  side_from: {name: hip_flexion, source: world}   # the moving leg: larger hip-flexion range
  orient_by: {name: hip_flexion, source: world, sign: 1}   # P6c: PC rises with the moving leg's hip flexion
reps:                            # P6c: per-video adaptive thresholds, the Step 0 method (PROGRESS §3.7.5)
  adaptive: true
  prominence_frac: 0.4           # x the video's p5-p95 signal range
  min_amplitude_frac: 0.3
  polarity: peak                 # P6c: rep = the moving hip flexing (signal oriented by orient_by)
  max_rep_s: 20.0
  quality_joints: [knee, ankle]  # best view of a synced group: trunk + the moving leg visible
pairs:                           # C1(c), A5: DTW angles for rep-matched pairs (user, 2026-10-20: lower-body angles)
  dtw_angles: [hip_flexion_left, hip_flexion_right, knee_flexion_left, knee_flexion_right]
eaaq:
  expected_reps: 10              # TODO: verify when the EAAQ appendix is available
assess:                          # Module III (M16 starting definitions, implemented 2026-10-20, M17); rules: TODO verify
                                 # against this exercise's EAAQ when the appendix is available (M5)
  angle: hip_flexion             # moving leg, trunk vs thigh (0 -> ~125 deg)
  rom_direction: max
  align: thigh                   # M17: the moving thigh's direction in the trunk frame
  mirror_left_side: true
  speed: {source: expert_data, expert_min_score: 95, eaaq_phase_s: null}
  channels: [hip_flexion, knee_flexion, contralateral_hip_flexion, contralateral_knee_flexion]
  posture_channels: [knee_flexion, contralateral_hip_flexion, contralateral_knee_flexion]   # pelvis stability (M14)
  score:
    angle_channels: [hip_flexion, knee_flexion, contralateral_hip_flexion, contralateral_knee_flexion]
    symmetry_channel: null
  rules:
    - {type: hip_flexion_range_insufficient, measure: rom_shortfall, joint: moving_hip}
    - {type: knee_angle_deviation, channel: knee_flexion, direction: both, joint: moving_knee}
    - {type: other_hip_flexed, channel: contralateral_hip_flexion, direction: above, joint: other_hip}
    - {type: other_knee_flexed, channel: contralateral_knee_flexion, direction: above, joint: other_knee}
    - {type: too_fast, measure: speed, direction: fast, joint: moving_hip}
    - {type: too_slow, measure: speed, direction: slow, joint: moving_hip}
