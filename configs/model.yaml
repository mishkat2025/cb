# Phase 2-3 config: ST-GCN encoder, projection and task heads, CVDC loss, pair builder, synthetic views and
# augmentations (Phase 2); trainer, methods and evaluation (Phase 3). Merged into configs/data.yaml by
# cvdc.config.load_config (top-level keys model, heads, supervised, cvdc, train, methods, eval, lifter). The CVDC
# pair weights per source stay in data.yaml (sync.pair_weights, C1).
# Decision IDs (C*, T*, A*) refer to DESIGN_DECISIONS.md.

model:
  input: xy                     # A1: xy (2 ch) | xyv (x, y, visibility) | xyz (3D world landmarks, B2)
  graph:
    layout: coco17              # P4: ST-GCN COCO layout (cvdc/data/skeleton.py), centre = nose
    strategy: spatial           # Yan et al. 2018 partition: uniform | distance | spatial
    max_hop: 1
  stgcn:                        # Yan et al. 2018: 10 blocks, residuals, temporal kernel 9, strides 2 at 64->128 and 128->256
    channels: [64, 64, 64, 64, 128, 128, 128, 256, 256, 256]
    strides: [1, 1, 1, 1, 2, 1, 1, 2, 1, 1]
    temporal_kernel: 9
    dropout: 0.0
    edge_importance: true       # learnable edge-importance mask per block
  embed_dim: 256                # C6: global-pooled embedding; a linear layer is added only if != last channel width
  projection: {hidden: 256, out: 128}   # C6: 2-layer MLP -> 128-d, L2-normalised
  exercise_embedding: 16        # T5: exercise embedding fed to the score / quality / item heads (not to the exercise head)

heads:                          # A3: linear heads on the embedding (hidden: 0), as in Yan et al.; also the linear probe
  hidden: 0
  dropout: 0.0
  # T2: rep level learns score + CF1-CF3 (+ quality, exercise); PF items only at set (video) level; D5 drops PF3
  targets_rep: [score, CF1, CF2, CF3, quality, exercise]
  targets_video: [score, PF1, PF2, PF4, CF1, CF2, CF3, quality, exercise]
  video_head:                   # step (a2), T13: set-level head on all rep embeddings of a video (rep heads stay)
    enabled: true
    pooling: [mean, attention]  # concatenated: mean of the rep embeddings and attention pooling (Ilse et al. 2018, non-gated)
    attn_hidden: 128
    count_feature: true         # + the set rep count (Phase 1 n_reps_set), standardised on the inner training videos
    count_csv: outputs/phase1/reps_per_video.csv
    exercise_embedding: 16      # T5
    targets: [score, PF1, PF2, PF4, CF1, CF2, CF3]   # D5: no PF3
    weight: 1.0                 # L_sup = L_rep + weight * L_video
  item_activity:                # T14: an item is learned / reported in a stratum (exercise x group) only if it varies there
    min_subjects_off_mode: 5    # off its modal value in videos of >= this many subjects (= the number of folds) ...
    min_sd: 0.05                # ... and SD >= this (0-1 scale, ~0.7 score points)

supervised:                     # loss weights per target (Phase 3 tunes them; T6 score weighting is TBD there)
  weights: {score: 1.0, items: 1.0, quality: 0.5, exercise: 0.5}

cvdc:
  sources: [sync, audio, rep, synthetic]   # C5 ablation: any subset; weights from sync.pair_weights
  loss:
    temperature: 0.1            # C3
    negatives: all_other_groups # C3: all_other_groups | different_exercise_only
    same_group_other_rep: neutral   # A4: other reps of the same (exercise, subject, variation) group: neutral | negative
  sampler:
    batch_sets: 64              # rep sets (all their loaded views) per batch
    one_set_per_group: true     # A4: avoid two reps of the same group in one batch (the loss masks them anyway)
  pairs:                        # A5: pair builder (cvdc/data/pairs.py)
    rep_pairing: index          # C1(c): not-synced / unknown groups pair reps by index ...
    dtw_angles: [shoulder_elevation_left, shoulder_elevation_right, elbow_left, elbow_right]  # ... aligned by DTW on 3D angles
    view_preference: [F, R, L]  # reference view a rep-paired set is time-aligned to
    pairs_csv: data/cvdc_pairs.csv
    members_csv: data/cvdc_members.csv
    aligned_suffix: _aligned    # DTW-aligned copies of rep-paired members: packs/reps_<js>_T<T>_aligned.npz
    summary_csv: outputs/phase2/table_pair_counts.csv
  synthetic:                    # C4: lift (MediaPipe world) -> rotate about the vertical axis -> pinhole projection
    views_per_set: 2            # synthetic views added per rep set, each from a random real member
    yaw_deg: [0, 45, -45, 90, -90]
    yaw_jitter_deg: 10
    pitch_jitter_deg: 0
    level: true                 # A8: orbit about the person's vertical axis, keeping the real camera's pitch
    distance: 5.0               # camera distance in torso lengths (~2.5 m for a 0.5 m torso)
    distance_jitter: 1.0
  augment:                      # A2: each view augmented independently; the temporal crop is shared within a set
    enabled: true
    rotate_deg: 10              # in-plane rotation
    scale: 0.1                  # uniform scale 1 +- 0.1
    shear: 0.1
    joint_dropout: 0.05         # probability per joint per item (joint set to the root, visibility 0)
    crop_min: 0.8               # temporal crop of 80-100 % of the rep, resampled back to T (also jitters speed)
    noise: 0.01                 # Gaussian noise, torso units
    share_temporal_crop: true   # keeps the time alignment of positives (C1); false = independent crops

train:                          # Phase 3 trainer (cvdc/train/); T1, T7-T12, A9
  seed: 0                       # fold k uses seed + k (model init, batch order, synthetic views, augmentation)
  device: auto                  # auto | cuda | cpu
  amp: bf16                     # bf16 | off (fp16 would need a GradScaler)
  lr: 0.001
  weight_decay: 0.0001
  unit: rep                     # T1: rep (default) | video
  batch_size: 256               # supervised reps per batch
  batch_size_video: 32          # supervised videos per batch (train.unit: video)
  eval_batch: 1024              # forward-only batches (embeddings, predictions, validation)
  max_epochs_cvdc: 100          # T8
  max_epochs_sup: 60            # T8
  warmup_frac: 0.05             # T9: linear warm-up over 5% of the max-epoch budget, then cosine decay to 0
  fine_tune: full               # T10: full | linear_probe (frozen encoder incl. its BatchNorm statistics; heads only)
  augment_supervised: true      # T11: the CVDC augmentations (A2) during supervised training, crops drawn per item
  sampler: video                # T13: supervised batches of whole videos (all their reps), >= batch_size reps each | rep
  rep_weighting: per_video      # T6 (a2): rep weight = 1 / n_reps of its video, so every video counts once | none
  cvdc_lambda: 0.0              # joint objective L_sup + lambda * L_cvdc during fine-tuning (spec §7; Proposed variants)
  cvdc_init_from: phase3a       # reuse the step (a) CVDC encoders (runs/<tag>/proposed/fold<k>/cvdc/best.pt); null = pretrain
  early_stopping:               # T8 / T8b (a2): supervised stage; inner validation split of the training subjects only
    patience: 15
    min_epochs: 10              # T8b: no epoch before this can be kept, and no stop before it
    ema: 0.7                    # T8b: stop / select on s_t = ema * s_(t-1) + (1 - ema) * val_t (s_1 = val_1); 0 = raw
    min_delta: 0.0
    inner_frac: 0.2             # share of the training subjects of each group (expert / non-expert) held out
    seed_offset: 1000           # inner split seed = eval.seed + seed_offset + fold
  early_stopping_cvdc:          # T8a: CVDC pretraining (unchanged from step (a))
    patience: 10
    min_epochs: 1
    ema: 0.0
    min_delta: 0.0
  runs_dir: runs
  smoke:                        # spec §7 smoke test: fold 0, 3 training subjects, 2 epochs
    train_subjects: [2, 1]      # (experts, non-experts) the model trains on
    val_subjects: [1, 1]        # inner validation
    test_subjects: [2, 1]
    epochs: 2

methods:                        # E14 step (a): identical splits, preprocessing, epoch budget and encoder size
  b1: {input: xy, cvdc: false}                  # 2D keypoints, from scratch
  b2_mediapipe: {input: xyz, cvdc: false}       # MediaPipe world landmarks, from scratch
  b2_ktpformer: {input: xyz_ktpformer, cvdc: false}   # KTPFormer lifted 3D (A10), from scratch
  b2_depthanything: {input: xyd_depthanything, cvdc: false}   # A11 (proposal completion): 2D x, y + DepthAnything depth
  proposed: {input: xy, cvdc: true}             # CVDC pretraining on the fold's training subjects, then full fine-tuning
  # step (a2) Proposed variants (same CVDC encoder per fold):
  proposed_lp: {input: xy, cvdc: true, fine_tune: linear_probe}   # (i) frozen CVDC encoder + heads
  proposed_j01: {input: xy, cvdc: true, cvdc_lambda: 0.1}         # (ii) L_sup + 0.1 L_cvdc during fine-tuning
  proposed_j1: {input: xy, cvdc: true, cvdc_lambda: 1.0}          # (ii) L_sup + 1.0 L_cvdc during fine-tuning

ablation:                       # Phase 5 (C5, E25): CVDC pair-source mixes, pretraining only, scored by the held-out VCI
  sources:                      # name: cvdc.sources of that setting (weights from sync.pair_weights)
    sync: [sync]                                  # (a) sync only
    sync_audio: [sync, audio]                     # (b) + audio
    sync_audio_rep: [sync, audio, rep]            # (c) + rep-matched
    all: [sync, audio, rep, synthetic]            # (d) + synthetic = the default cvdc.sources
    all_no_rep: [sync, audio, synthetic]          # (d') all without rep-matched pairs (C5)
    synthetic: [synthetic]                        # (e) synthetic only
  reuse: {all: phase3a}         # settings whose pretraining already exists: runs/<tag>/proposed/fold<k>/ (same config)
  runs_tag: phase5_sources      # runs/<runs_tag>/<setting>/fold<k>/

eval:                           # E1, E3, E9, E13, E15-E18
  proposed_default: proposed_j1      # T15 (user, 2026-10-19): "Proposed" = joint loss, lambda 1.0, in every later table
  proposed_alternative: proposed_lp  # the frozen CVDC encoder + heads, reported next to it
  split: group_kfold
  k: 5
  seed: 0
  bootstrap: {n: 2000, seed: 0, ci: 0.95}       # E17: subject-level bootstrap, percentile CIs
  noise_floor: {E01: 5.28, E02: 4.38}           # E3: inter-view label-noise floor (score RMSE, expert groups)
  results_dir: outputs/results   # reports write to <results_dir>/<tag> (phase3a, phase3a2, ..._smoke)

lifter:                         # A10: B2's second 3D source. KTPFormer (Peng et al., CVPR 2024), Human3.6M model on CPN 2D
  name: ktpformer
  code_dir: third_party/KTPFormer   # git clone https://github.com/JihuaPeng/KTPFormer @ b961951 (no licence: never committed)
  weights: data/models/ktpformer/ktpformer_243_cpn_state_dict.pt   # tensors-only copy of model_243_CPN_best_epoch.bin
  frames: 243
  fps: 50                       # H36M frame rate: 2D resampled 30 -> 50 fps, 3D back to 30 fps
  stride: 81                    # overlapping windows, outputs averaged (243 = no overlap: 2x faster, 0.012 torso lengths off)
  input_torso: 0.3              # median 2D torso length in H36M screen-normalised units (chosen by view consistency, A10)
  flip_test: true               # test-time flip averaging, as in the reference evaluation
  batch: 16                     # windows per batch (32 used 12.6 GB and spilled into shared memory on Windows)
  amp: bf16                     # 897 vs 540 frames/s; mean joint difference to fp32 0.002 torso lengths
  out_dir: data/cache/lift_ktpformer
