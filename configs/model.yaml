# Phase 2 config: ST-GCN encoder, projection and task heads, CVDC loss, pair builder, synthetic views and
# augmentations. Merged into configs/data.yaml by cvdc.config.load_config (top-level keys model, heads,
# cvdc, supervised). The CVDC pair weights per source stay in data.yaml (sync.pair_weights, C1).
# Decision IDs (C*, T*, A*) refer to DESIGN_DECISIONS.md.

model:
  input: xy                     # A1: xy (2 ch) | xyv (x, y, visibility) | xyz (3D world landmarks, B2)
  graph:
    layout: coco17              # P4: ST-GCN COCO layout (cvdc/data/skeleton.py), centre = nose
    strategy: spatial           # Yan et al. 2018 partition: uniform | distance | spatial
    max_hop: 1
  stgcn:                        # Yan et al. 2018: 10 blocks, residuals, temporal kernel 9, strides 2 at 64->128 and 128->256
    channels: [64, 64, 64, 64, 128, 128, 128, 256, 256, 256]
    strides: [1, 1, 1, 1, 2, 1, 1, 2, 1, 1]
    temporal_kernel: 9
    dropout: 0.0
    edge_importance: true       # learnable edge-importance mask per block
  embed_dim: 256                # C6: global-pooled embedding; a linear layer is added only if != last channel width
  projection: {hidden: 256, out: 128}   # C6: 2-layer MLP -> 128-d, L2-normalised
  exercise_embedding: 16        # T5: exercise embedding fed to the score / quality / item heads (not to the exercise head)

heads:                          # A3: linear heads on the embedding (hidden: 0), as in Yan et al.; also the linear probe
  hidden: 0
  dropout: 0.0
  # T2: rep level learns score + CF1-CF3 (+ quality, exercise); PF items only at set (video) level; D5 drops PF3
  targets_rep: [score, CF1, CF2, CF3, quality, exercise]
  targets_video: [score, PF1, PF2, PF4, CF1, CF2, CF3, quality, exercise]

supervised:                     # loss weights per target (Phase 3 tunes them; T6 score weighting is TBD there)
  weights: {score: 1.0, items: 1.0, quality: 0.5, exercise: 0.5}

cvdc:
  sources: [sync, audio, rep, synthetic]   # C5 ablation: any subset; weights from sync.pair_weights
  loss:
    temperature: 0.1            # C3
    negatives: all_other_groups # C3: all_other_groups | different_exercise_only
    same_group_other_rep: neutral   # A4: other reps of the same (exercise, subject, variation) group: neutral | negative
  sampler:
    batch_sets: 64              # rep sets (all their loaded views) per batch
    one_set_per_group: true     # A4: avoid two reps of the same group in one batch (the loss masks them anyway)
  pairs:                        # A5: pair builder (cvdc/data/pairs.py)
    rep_pairing: index          # C1(c): not-synced / unknown groups pair reps by index ...
    dtw_angles: [shoulder_elevation_left, shoulder_elevation_right, elbow_left, elbow_right]  # ... aligned by DTW on 3D angles
    view_preference: [F, R, L]  # reference view a rep-paired set is time-aligned to
    pairs_csv: data/cvdc_pairs.csv
    members_csv: data/cvdc_members.csv
    aligned_suffix: _aligned    # DTW-aligned copies of rep-paired members: packs/reps_<js>_T<T>_aligned.npz
    summary_csv: outputs/phase2/table_pair_counts.csv
  synthetic:                    # C4: lift (MediaPipe world) -> rotate about the vertical axis -> pinhole projection
    views_per_set: 2            # synthetic views added per rep set, each from a random real member
    yaw_deg: [0, 45, -45, 90, -90]
    yaw_jitter_deg: 10
    pitch_jitter_deg: 0
    level: true                 # A8: orbit about the person's vertical axis, keeping the real camera's pitch
    distance: 5.0               # camera distance in torso lengths (~2.5 m for a 0.5 m torso)
    distance_jitter: 1.0
  augment:                      # A2: each view augmented independently; the temporal crop is shared within a set
    enabled: true
    rotate_deg: 10              # in-plane rotation
    scale: 0.1                  # uniform scale 1 +- 0.1
    shear: 0.1
    joint_dropout: 0.05         # probability per joint per item (joint set to the root, visibility 0)
    crop_min: 0.8               # temporal crop of 80-100 % of the rep, resampled back to T (also jitters speed)
    noise: 0.01                 # Gaussian noise, torso units
    share_temporal_crop: true   # keeps the time alignment of positives (C1); false = independent crops

train:                          # Phase 2 smoke settings (Phase 3 adds the full trainer)
  seed: 0
  device: auto                  # auto | cuda | cpu
  amp: bf16                     # bf16 | fp16 | off
  lr: 0.001
  weight_decay: 0.0001
